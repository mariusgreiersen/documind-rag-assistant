name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests, evaluation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      HF_HOME: ${{ github.workspace }}/.cache/hf
      # No LLM key in CI: the suite uses the mock provider and must not need one.
      LLM_PROVIDER: none
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy)
        run: mypy documind

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/hf
          key: hf-${{ hashFiles('backend/documind/core/config.py') }}

      - name: Unit and API tests
        run: pytest -m "not model" -q

      - name: RAG integration tests (real embedding model, ChromaDB, mock LLM)
        run: pytest -m "model and not live_llm" -q

      - name: Retrieval evaluation
        run: python -m documind.evaluation.run --out ../evals/results-ci

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation
          path: evals/results-ci/

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
